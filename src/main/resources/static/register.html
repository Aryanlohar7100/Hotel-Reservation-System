<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account — StayEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar stayease-navbar">
        <div class="container">
            <a class="brand-logo" href="/">
                <i class="bi bi-buildings-fill text-warning"></i> Stay<span>Ease</span>
            </a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i> Back to Home</a>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm">
                    <div class="text-center mb-4">
                        <div class="badge bg-warning text-dark px-3 py-1 rounded-pill fw-bold mb-2">Member Registration</div>
                        <h3 class="fw-bold mb-1">Create Your Account</h3>
                        <p class="text-muted small">Join StayEase for instant luxury reservations and exclusive hospitality perks</p>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Full Name</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                                <input type="text" id="regFullName" class="form-control border-start-0" required placeholder="Alexander Vance">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" id="regEmail" class="form-control border-start-0" required placeholder="alex@example.com">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Mobile Phone Number</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-telephone text-muted"></i></span>
                                <input type="tel" id="regPhone" class="form-control border-start-0" placeholder="+91 98765 43210">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">Password (minimum 6 characters)</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" id="regPassword" class="form-control border-start-0" minlength="6" required placeholder="••••••••">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-gold w-100 py-2 fw-bold shadow-sm">
                            Create Account
                        </button>
                    </form>

                    <div class="text-center mt-4 small text-muted">
                        Already have an account? <a href="/login.html" class="text-warning fw-bold text-decoration-none">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-stayease mt-auto">
        <div class="container text-center small text-muted">
            © 2026 StayEase Hospitality Systems. Full-Stack Java Architecture.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value;
            const email = document.getElementById('regEmail').value;
            const phone = document.getElementById('regPhone').value;
            const password = document.getElementById('regPassword').value;

            Auth.register(fullName, email, password, phone);
        });
    </script>
</body>
</html>

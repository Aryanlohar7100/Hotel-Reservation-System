<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — StayEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <nav class="navbar stayease-navbar">
        <div class="container">
            <a class="brand-logo" href="/">
                <i class="bi bi-buildings-fill text-warning"></i> Stay<span>Ease</span>
            </a>
            <a href="/" class="btn btn-outline-light btn-sm"><i class="bi bi-house me-1"></i> Back to Home</a>
        </div>
    </nav>

    <div class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="bg-white p-4 p-md-5 rounded-4 border shadow-sm">
                    <div class="text-center mb-4">
                        <div class="badge bg-warning text-dark px-3 py-1 rounded-pill fw-bold mb-2">Member Portal</div>
                        <h3 class="fw-bold mb-1">Welcome Back</h3>
                        <p class="text-muted small">Sign in to manage your luxury hotel reservations</p>
                    </div>

                    <!-- Quick Fill Demo Credentials -->
                    <div class="p-3 bg-light rounded-3 mb-4 border">
                        <div class="small fw-bold text-muted mb-2"><i class="bi bi-key-fill text-warning me-1"></i> Quick Test Credentials:</div>
                        <div class="d-flex gap-2">
                            <button type="button" onclick="fillAdmin()" class="btn btn-sm btn-outline-dark w-50">
                                <i class="bi bi-shield-lock me-1"></i> Admin Demo
                            </button>
                            <button type="button" onclick="fillCustomer()" class="btn btn-sm btn-outline-primary w-50">
                                <i class="bi bi-person me-1"></i> Customer Demo
                            </button>
                        </div>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-muted">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                                <input type="email" id="loginEmail" class="form-control border-start-0" required placeholder="name@example.com">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-muted">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                                <input type="password" id="loginPassword" class="form-control border-start-0" required placeholder="••••••••">
                            </div>
                        </div>

                        <button type="submit" id="loginSubmitBtn" class="btn btn-gold w-100 py-2 fw-bold shadow-sm">
                            <span>Sign In to Account</span>
                        </button>
                    </form>

                    <div class="text-center mt-4 small text-muted">
                        Don't have an account yet? <a href="/register.html" class="text-warning fw-bold text-decoration-none">Create Account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer-stayease mt-auto">
        <div class="container text-center small text-muted">
            © 2026 StayEase Hospitality Systems. Full-Stack Java Architecture.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        function fillAdmin() {
            document.getElementById('loginEmail').value = 'admin@stayease.com';
            document.getElementById('loginPassword').value = 'admin123';
        }

        function fillCustomer() {
            document.getElementById('loginEmail').value = 'john@example.com';
            document.getElementById('loginPassword').value = 'customer123';
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const params = new URLSearchParams(window.location.search);
            const redirect = params.get('redirect') ? decodeURIComponent(params.get('redirect')) : null;

            Auth.login(email, password, redirect);
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Hotels — StayEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg stayease-navbar sticky-top">
        <div class="container">
            <a class="brand-logo" href="/">
                <i class="bi bi-buildings-fill text-warning"></i> Stay<span>Ease</span>
            </a>
            <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/hotels.html">Explore Hotels</a></li>
                    <li class="nav-item"><a class="nav-link" href="/customer-dashboard.html">My Bookings</a></li>
                </ul>
                <div id="navbarAuthSection"></div>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="bg-dark text-white py-4 mb-4 border-bottom border-warning border-opacity-25">
        <div class="container">
            <h2 class="fw-bold mb-1">Explore Our Hotel Collection</h2>
            <p class="text-white-50 mb-0 small">Discover 5-star properties, heritage palaces, and boutique resorts across India.</p>
        </div>
    </div>

    <div class="container mb-5">
        <div class="row g-4">
            <!-- Sidebar Filters -->
            <div class="col-lg-3">
                <div class="bg-white p-4 rounded-4 border shadow-sm sticky-top" style="top: 90px; z-index: 10;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="fw-bold mb-0"><i class="bi bi-funnel-fill text-warning me-2"></i>Filters</h5>
                        <button id="resetFiltersBtn" class="btn btn-sm btn-link text-decoration-none text-muted p-0">Reset</button>
                    </div>

                    <!-- Keyword Search -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Keyword</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-search text-muted"></i></span>
                            <input type="text" id="filterKeyword" class="form-control border-start-0" placeholder="Hotel name or street...">
                        </div>
                    </div>

                    <!-- Destination City -->
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted text-uppercase">Destination City</label>
                        <select id="filterCity" class="form-select">
                            <option value="">All Destinations</option>
                        </select>
                    </div>

                    <!-- Rating Filter -->
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted text-uppercase">Minimum Rating</label>
                        <select id="filterRating" class="form-select">
                            <option value="">Any Star Rating</option>
                            <option value="4.8">4.8 & Above (Exceptional)</option>
                            <option value="4.5">4.5 & Above (Superb)</option>
                            <option value="4.0">4.0 & Above (Very Good)</option>
                        </select>
                    </div>

                    <button id="applyFiltersBtn" class="btn btn-gold w-100 fw-bold">
                        Apply Filters
                    </button>
                </div>
            </div>

            <!-- Hotels Catalogue -->
            <div class="col-lg-9">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div id="resultsCount" class="text-muted small fw-semibold">Loading hotels...</div>
                </div>

                <div id="hotelsListGrid" class="row g-4">
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-warning" role="status">
                            <span class="visually-hidden">Loading properties...</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-stayease mt-auto">
        <div class="container text-center small text-muted">
            © 2026 StayEase Hospitality Systems. Full-Stack Java Architecture.
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const params = new URLSearchParams(window.location.search);
            const cityParam = params.get('city') || '';
            const keywordParam = params.get('keyword') || '';

            // Load Cities
            try {
                const res = await API.get('/hotels/cities');
                if (res && res.data) {
                    const sel = document.getElementById('filterCity');
                    res.data.forEach(c => {
                        const opt = document.createElement('option');
                        opt.value = c;
                        opt.textContent = c;
                        if (c.toLowerCase() === cityParam.toLowerCase()) {
                            opt.selected = true;
                        }
                        sel.appendChild(opt);
                    });
                }
            } catch (e) {
                console.error(e);
            }

            if (keywordParam) {
                document.getElementById('filterKeyword').value = keywordParam;
            }

            loadHotels();

            document.getElementById('applyFiltersBtn').addEventListener('click', () => loadHotels());
            document.getElementById('resetFiltersBtn').addEventListener('click', () => {
                document.getElementById('filterCity').value = '';
                document.getElementById('filterRating').value = '';
                document.getElementById('filterKeyword').value = '';
                loadHotels();
            });
        });

        async function loadHotels() {
            const grid = document.getElementById('hotelsListGrid');
            const countEl = document.getElementById('resultsCount');

            const city = document.getElementById('filterCity').value;
            const minRating = document.getElementById('filterRating').value;
            const keyword = document.getElementById('filterKeyword').value;

            try {
                const res = await API.get('/hotels', { city, minRating, keyword });
                if (!res.data || res.data.length === 0) {
                    countEl.textContent = '0 properties found';
                    grid.innerHTML = `
                        <div class="col-12 text-center py-5 bg-white rounded-4 border">
                            <i class="bi bi-building-x text-muted fs-1 mb-2 d-block"></i>
                            <h5 class="fw-bold">No Hotels Match Your Criteria</h5>
                            <p class="text-muted small">Try broadening your search or resetting filters.</p>
                        </div>
                    `;
                    return;
                }

                countEl.textContent = `Showing ${res.data.length} luxury propert${res.data.length === 1 ? 'y' : 'ies'}`;

                grid.innerHTML = res.data.map(h => `
                    <div class="col-md-6">
                        <div class="hotel-card">
                            <div class="hotel-card-img-wrap">
                                <img src="${h.imageUrl || 'https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80'}" 
                                     alt="${h.name}" class="hotel-card-img" onerror="this.src='https://images.unsplash.com/photo-1566073771259-6a8506099945?auto=format&fit=crop&w=800&q=80'">
                                <div class="badge-rating">
                                    <i class="bi bi-star-fill text-warning"></i>
                                    <span>${h.starRating ? h.starRating.toFixed(1) : '4.5'}</span>
                                </div>
                                <div class="badge-city">
                                    <i class="bi bi-geo-alt-fill text-danger me-1"></i>${h.city}
                                </div>
                            </div>
                            <div class="hotel-card-body">
                                <h4 class="hotel-card-title">${h.name}</h4>
                                <div class="hotel-card-address">
                                    <i class="bi bi-geo"></i>
                                    <span>${h.address}, ${h.city}</span>
                                </div>
                                <p class="hotel-card-desc">${h.description || 'Exclusive luxury hotel with premium rooms and five-star hospitality amenities.'}</p>
                                <div class="hotel-card-footer">
                                    <div>
                                        <div class="price-sub">Rates From</div>
                                        <div class="price-tag">₹5,500 <span class="fs-6 fw-normal text-muted">/ night</span></div>
                                    </div>
                                    <a href="/hotel-detail.html?id=${h.id}" class="btn btn-gold btn-sm px-3">
                                        Check Rooms <i class="bi bi-chevron-right ms-1"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                grid.innerHTML = `<div class="col-12 text-center text-danger py-5">Error loading hotels: ${err.message}</div>`;
            }
        }
    </script>
</body>
</html>
